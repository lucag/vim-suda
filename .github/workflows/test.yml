name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install Vim
        run: command -v vim || (sudo apt-get update && sudo apt-get install -y vim)
      - run: test/run.sh
        env:
          SUDA_TEST_REQUIRE_VIM: 1
